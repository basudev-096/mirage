services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - aegis-net

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - aegis-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_telemetry
    ports:
      - "5433:5432"
    volumes:
      - aegis-postgres-data:/var/lib/postgresql/data
    networks:
      - aegis-net

  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy
    ports:
      - "8443:8443"
    depends_on:
      - backend
      - redis
      - postgres
    environment:
      AEGIS_WAF_TIMEOUT: ${AEGIS_WAF_TIMEOUT:-250ms}
      AEGIS_TARPIT: ${AEGIS_TARPIT:-true}
      REDIS_ADDR: redis:6379
      REDIS_STREAM: aegis:events
    networks:
      - aegis-net

  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    ports:
      - "8090:8090"
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://aegis:aegis_password@postgres:5432/aegis_telemetry
      INGEST_LISTEN_ADDR: :8090
    networks:
      - aegis-net

  dashboard:
    build:
      context: ../web/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AEGIS_WS_URL: ws://localhost:8090/ws
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - ingest
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge

volumes:
  aegis-postgres-data:
